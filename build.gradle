buildscript {
    repositories {
        maven {
            url 'https://dl.bintray.com/giancosta86/Hephaestus'
        }

        jcenter()
    }

    dependencies {
        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.6'
        classpath 'info.gianlucacosta.moonlicense:moonlicense-gradle:4.3'
        classpath 'info.gianlucacosta.aurora:aurora:7.0'
    }
}


apply plugin: 'scala'
apply plugin: 'osgi'
apply plugin: 'maven'
apply plugin: 'com.jfrog.bintray'
apply plugin: 'info.gianlucacosta.moonlicense'
apply plugin: 'info.gianlucacosta.aurora'


group = 'info.gianlucacosta.eighthbridge'
archivesBaseName = 'eighthbridge'
version = '8.2'

description = 'Interactive graph modeling and rendering for ScalaFX'

ext.facebookPage = "https://www.facebook.com/EighthBridge-190637781313301"


dependencies {
    generatedCompile 'org.scala-lang:scala-library:2.11.8'

    compile 'org.scala-lang:scala-library:2.11.8'

    compile 'info.gianlucacosta.helios:helios-fx:5.2'
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }

    bintray {
        repo = 'Hephaestus'
        licenses = ['Apache-2.0']
        labels = [
                'graph',
                'modeling',
                'rendering',
                'interactive',
                'Scala',
                'ScalaFX',
                'functional',
                'OOP',
                'JavaFX'
        ]
    }
}


moonLicense {
    license = apache2

    productInfo {
        productName = 'EighthBridge'
        inceptionYear = 2016
        copyrightHolder = 'Gianluca Costa'
    }
}
