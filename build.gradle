buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
    }
}


apply plugin: 'scala'
apply plugin: 'osgi'
apply plugin: 'maven'
apply plugin: 'info.gianlucacosta.aurora'


group = 'info.gianlucacosta.eighthbridge'
archivesBaseName = 'eighthbridge'
version = '9.0.0-SNAPSHOT'

description = 'Interactive graph modeling and rendering for ScalaFX'


dependencies {
    compile 'org.scala-lang:scala-library:2.11.8'

    compile 'info.gianlucacosta.helios:helios-fx:7.0.0-SNAPSHOT'
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}